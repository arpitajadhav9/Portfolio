<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="star-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#2d1e0f" flood-opacity="0.18" />
    </filter>
    <linearGradient id="gold-grad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <g filter="url(#star-shadow)">
    <!-- Die-Cut White Outline -->
    <path d="M32 4 C32 18, 46 32, 60 32 C46 32, 32 46, 32 60 C32 46, 18 32, 4 32 C18 32, 32 18, 32 4 Z" 
          fill="#ffffff" stroke="#e2d6c5" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Gold Star Body -->
    <path d="M32 7 C32 20, 44 32, 57 32 C44 32, 32 44, 32 57 C32 44, 20 32, 7 32 C20 32, 32 20, 32 7 Z" 
          fill="url(#gold-grad)" />
    
    <!-- Inner Sparkle Highlight -->
    <circle cx="30" cy="28" r="3.5" fill="#ffffff" opacity="0.85" />
    <path d="M32 14 L33.5 27 L44 32 L33.5 37 L32 50 L30.5 37 L20 32 L30.5 27 Z" fill="#ffffff" opacity="0.4" />
  </g>
</svg>
