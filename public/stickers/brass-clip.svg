<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 48" width="140" height="48" fill="none">
  <defs>
    <!-- Realistic Brushed Gold / Brass Metallic Gradient -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="brass-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="clamp-shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#2d1e0f" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#clamp-shadow)">
    <!-- Main Horizontal Clamp Bar -->
    <path d="M12 28 H128 C131 28, 133 30, 132 33 L129 44 C128 46, 126 47, 124 47 H16 C14 47, 12 46, 11 44 L8 33 C7 30, 9 28, 12 28 Z" 
          fill="url(#brass-grad)" stroke="url(#brass-rim)" stroke-width="1.2" />

    <!-- Top Mounting Flange / Arched Handle of Clip -->
    <path d="M48 28 V16 C48 10, 52 6, 58 6 H82 C88 6, 92 10, 92 16 V28 Z" 
          fill="url(#brass-grad)" stroke="url(#brass-rim)" stroke-width="1.2" />

    <!-- Center Hanging Hole -->
    <circle cx="70" cy="14" r="5" fill="#451a03" stroke="#b45309" stroke-width="1.5" />
    <circle cx="70" cy="14" r="3.5" fill="#291205" />

    <!-- Embossed Rivets / Decorative Screws on Clamp -->
    <circle cx="24" cy="37" r="2.5" fill="#fef08a" stroke="#78350f" stroke-width="0.8" />
    <line x1="22.5" y1="37" x2="25.5" y2="37" stroke="#78350f" stroke-width="0.8" />

    <circle cx="116" cy="37" r="2.5" fill="#fef08a" stroke="#78350f" stroke-width="0.8" />
    <line x1="114.5" y1="37" x2="117.5" y2="37" stroke="#78350f" stroke-width="0.8" />

    <!-- Subtle Metallic Highlight Glint across clamp -->
    <rect x="20" y="30" width="100" height="2" rx="1" fill="#ffffff" opacity="0.45" />
  </g>
</svg>
