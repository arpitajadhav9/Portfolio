<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 32" width="70" height="32" fill="none">
  <defs>
    <linearGradient id="gold-pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="pin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#451a03" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <g filter="url(#pin-shadow)">
    <!-- Pin loop at left -->
    <circle cx="10" cy="16" r="6" stroke="url(#gold-pin-grad)" stroke-width="2.8" fill="none" />
    
    <!-- Top arm -->
    <path d="M10 10 L54 10" stroke="url(#gold-pin-grad)" stroke-width="2.8" stroke-linecap="round" />
    
    <!-- Bottom needle arm -->
    <path d="M10 22 L52 20" stroke="url(#gold-pin-grad)" stroke-width="2.4" stroke-linecap="round" />
    
    <!-- Safety head cap at right -->
    <rect x="50" y="7" width="16" height="18" rx="4" fill="url(#gold-pin-grad)" />
    <!-- Cap detail hole -->
    <circle cx="58" cy="16" r="2.2" fill="#713f12" />
    <path d="M52 16 L56 16" stroke="#fef08a" stroke-width="1.2" />
  </g>
</svg>
