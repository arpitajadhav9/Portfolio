<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" fill="none">
  <defs>
    <!-- Scalloped Stamp Outline Mask / Path -->
    <filter id="stamp-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2d1e0f" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- White Die-Cut Border Around Stamp -->
  <g filter="url(#stamp-shadow)">
    <!-- Stamp Base with Perforated / Scalloped Look -->
    <rect x="6" y="6" width="88" height="108" rx="3" fill="#ffffff" stroke="#e2d6c5" stroke-width="1.5" />
    
    <!-- Stamp Body Inner Color -->
    <rect x="12" y="12" width="76" height="96" rx="2" fill="#faf5ed" stroke="#cbb89d" stroke-width="1" stroke-dasharray="3 2" />
    
    <!-- Botanical / Flower Illustration -->
    <g transform="translate(50, 52)">
      <!-- Stem -->
      <path d="M0 24 Q -4 8 0 -8 Q 4 -20 0 -26" stroke="#4a5d4e" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Leaves -->
      <path d="M-1 10 Q -10 6 -8 0 Q -2 4 0 10" fill="#607d67"/>
      <path d="M1 0 Q 10 -4 8 -10 Q 2 -6 0 0" fill="#607d67"/>
      <!-- Flower Petals -->
      <circle cx="0" cy="-26" r="3.5" fill="#d97706" />
      <circle cx="-6" cy="-26" r="3" fill="#fde68a" />
      <circle cx="6" cy="-26" r="3" fill="#fde68a" />
      <circle cx="0" cy="-32" r="3" fill="#fde68a" />
      <circle cx="0" cy="-20" r="3" fill="#fde68a" />
    </g>

    <!-- Stamp Typography -->
    <text x="50" y="24" font-family="'Courier New', Courier, monospace" font-size="6.5" font-weight="700" fill="#8c7355" text-anchor="middle" letter-spacing="1.5">AIR MAIL</text>
    <text x="50" y="100" font-family="'Courier New', Courier, monospace" font-size="6" font-weight="600" fill="#a38f78" text-anchor="middle" letter-spacing="1">POSTAGE 25¢</text>

    <!-- Vintage Cancellation Postmark -->
    <g transform="rotate(-15 65 35)" stroke="#78350f" stroke-width="1.2" opacity="0.65">
      <circle cx="68" cy="36" r="14" fill="none" stroke-dasharray="2 1.5"/>
      <line x1="56" y1="36" x2="80" y2="36" />
      <line x1="58" y1="32" x2="78" y2="32" />
      <line x1="58" y1="40" x2="78" y2="40" />
      <text x="68" y="29" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#78350f" text-anchor="middle">PAR AVION</text>
    </g>
  </g>
</svg>
