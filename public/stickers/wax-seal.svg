<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="wax-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#4c0519" flood-opacity="0.32" />
    </filter>
    <radialGradient id="wax-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </radialGradient>
    <radialGradient id="wax-inner" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="60%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>
  </defs>

  <g filter="url(#wax-shadow)">
    <!-- Organic Melted Wax Outer Edge -->
    <path d="M32 4 C40 3, 49 6, 54 12 C60 18, 62 26, 60 34 C58 42, 54 50, 46 56 C38 61, 28 62, 20 58 C12 53, 5 46, 4 37 C3 28, 6 20, 11 13 C16 7, 24 5, 32 4 Z" 
          fill="url(#wax-grad)" stroke="#fda4af" stroke-width="0.8" />

    <!-- Inner Stamp Recess -->
    <circle cx="32" cy="33" r="18" fill="url(#wax-inner)" stroke="#9f1239" stroke-width="1.2" />

    <!-- Embossed Rosette / Flower Centerpiece -->
    <g transform="translate(32, 33)" stroke="#fecdd3" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.92">
      <!-- Petals -->
      <circle cx="0" cy="0" r="3" fill="#ffe4e6" />
      <path d="M0 -3 C-3 -9, 3 -9, 0 -3" />
      <path d="M0 3 C-3 9, 3 9, 0 3" />
      <path d="M-3 0 C-9 -3, -9 3, -3 0" />
      <path d="M3 0 C9 -3, 9 3, 3 0" />
      <path d="M-2 -2 C-7 -7, -4 -9, -2 -2" />
      <path d="M2 2 C7 7, 4 9, 2 2" />
      <path d="M2 -2 C7 -7, 9 -4, 2 -2" />
      <path d="M-2 2 C-7 7, -9 4, -2 2" />
    </g>

    <!-- Glossy Wax Highlight Arc -->
    <path d="M16 16 C22 10, 34 8, 44 11" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
