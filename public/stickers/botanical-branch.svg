<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130" fill="none">
  <defs>
    <!-- Soft Watercolor Leaf Gradients -->
    <linearGradient id="leaf-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8a694" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8c7866" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="leaf-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9b9a8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#9d8a78" stop-opacity="0.9" />
    </linearGradient>

    <filter id="branch-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#453225" flood-opacity="0.14" />
    </filter>
  </defs>

  <g filter="url(#branch-shadow)">
    <!-- Main Branch Stem -->
    <path d="M78 122 C64 96, 46 62, 34 8" stroke="#846e5b" stroke-width="2.2" stroke-linecap="round" />

    <!-- Leaf Pair 1 (Bottom) -->
    <path d="M68 98 C50 96, 44 82, 54 74 C64 78, 68 88, 68 98 Z" fill="url(#leaf-grad-1)" />
    <path d="M70 94 C86 90, 94 78, 86 68 C76 72, 70 82, 70 94 Z" fill="url(#leaf-grad-2)" />

    <!-- Leaf Pair 2 (Middle) -->
    <path d="M54 72 C36 68, 30 52, 40 44 C50 48, 54 58, 54 72 Z" fill="url(#leaf-grad-2)" />
    <path d="M56 68 C72 62, 80 48, 70 38 C62 44, 56 54, 56 68 Z" fill="url(#leaf-grad-1)" />

    <!-- Leaf Pair 3 (Upper) -->
    <path d="M42 44 C26 38, 22 24, 32 16 C40 20, 44 32, 42 44 Z" fill="url(#leaf-grad-1)" />
    <path d="M44 40 C58 32, 64 18, 54 10 C46 16, 42 28, 44 40 Z" fill="url(#leaf-grad-2)" />

    <!-- Tip Leaf -->
    <path d="M34 8 C30 -2, 38 -6, 40 0 C40 6, 36 8, 34 8 Z" fill="url(#leaf-grad-1)" />
  </g>
</svg>
